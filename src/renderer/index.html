<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hiku</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
  <div>
    <div class="app">
      <div class="window-controls">
        <button class="min-btn" title="Minimize" style="background-color: saddlebrown; border-radius: 8px;">-</button>
        <button class="clse-btn" title="Close" style="background-color: saddlebrown; border-radius: 8px;">X</button>
      </div>
      <div class="navigation">
        <button class="hamburger" onclick="show()" style="background-color: saddlebrown; border-radius: 10px;">
          <div id="bar1" class="bar"></div>
          <div id="bar2" class="bar"></div>
          <div id="bar3" class="bar"></div>
          i
        </button>
        <nav>
          <ul>
            <li><a >Artista: </a></li>
            <li><a >Productor: </a></li>
            <li><a >Fecha: </a></li>
          </ul>
        </nav>
      </div>
      <select style="background-color: saddlebrown; border-radius: 8px;">
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </div>

    <div class="container">
      <div class="screen" id="dropArea">
        <div class="botons-1">
          <button class="btnRep"><img src="../../assets/images/arrow_left.png" alt="Back"></button>
          <button class="btnRep"><img src="../../assets/images/Group 4.png" alt="Pause"></button>
          <button class="btnRep"><img src="../../assets/images/arrow_right.png" alt="Forward"></button>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="audio/*" style="display: none;" />
      <audio id="audio"></audio>
    </div>

    <div class="container">
      <div class="screen" id="dropArea">
        <div class="botons-2">
          <button id="btnUp" class="btnUp"><img id="uploadMusicIcon" src="../../assets/images/upload btn.png"></button>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="audio/*" style="display: none;" />
      <audio id="audio"></audio>
    </div>
  </div>
    <script src="js/script.js"></script>
  </body>
</html>
